# The beta channel: what is on the beta branch, ahead of the stable release.
# Use docker-compose.private.yml unless you specifically want to test
# something that has not shipped yet.
services:
  slicksync:
    image: ghcr.io/slicknsliding/slicksync:beta
    env_file:
      - .env
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - copy env.example to .env and generate one with "openssl rand -base64 32"}
      # Left unset on purpose: one generates itself on first boot and is kept
      # in the data volume below.
    user: "1001:1001"
    # Opens SlickSync on port 3000 of every network this machine is on, so
    # http://<server-address>:3000 works straight away. Docker opens this
    # past the host firewall (ufw does not block it). If a reverse proxy on
    # this same machine (Traefik, Caddy, nginx) is your way in, use
    # "127.0.0.1:3000:3000" instead so only the proxy can reach it.
    ports:
      - "3000:3000"
    volumes:
      # Same reasoning as the private compose - the database and the generated
      # encryption key live here and must outlive the container.
      - slicksync_data:/app/data
    restart: unless-stopped

volumes:
  slicksync_data:
