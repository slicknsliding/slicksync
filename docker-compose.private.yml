services:
  slicksync:
    # Pre-built, multi-arch (amd64+arm64) image published by
    # .github/workflows/private-release.yml on every version tag - just
    # `docker compose pull && docker compose up -d` for updates, no local
    # build needed. Prefer building from source instead (e.g. to audit the
    # code yourself, or to run an unreleased commit)? Comment this line out
    # and uncomment the `build:` block below.
    image: ghcr.io/slicknsliding/slicksync:private
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     INSTANCE: private
    #     NEXT_PUBLIC_API_URL: ''
    environment:
      JWT_SECRET: 'temp-jwt-secret-key'
      ENCRYPTION_KEY: 'temp-encryption-key-32-chars-long'

      # To enable private instance authentication, uncomment the following variables
      # SLICKSYNC_PRIVATE_USERNAME: ''
      # SLICKSYNC_PRIVATE_PASSWORD: ''

      # Public URL this instance is reachable at, used to build clickable
      # links (e.g. Vault alert "Fix now" links) in Discord notifications.
      # Leave unset to skip those links rather than post a broken one.
      # PUBLIC_APP_URL: 'https://example.com'
    user: "1001:1001"
    # volumes:
      # - ./data:/app/data
    ports:
      - "3000:3000"
      - "4000:4000"
