services:
  slicksync:
    image: ghcr.io/slicknsliding/slicksync:private
    # Reads the .env you copied from env.example. Without this, nothing you
    # put in that file reaches the container.
    env_file:
      - .env
    environment:
      # Signs login sessions, so it has to be real randomness. Generate one
      # with: openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set - copy env.example to .env and generate one with "openssl rand -base64 32"}
      # Deliberately not set here. Left unset, the instance generates one on
      # first boot and keeps it in the data volume below, which is why that
      # volume must survive updates - it is what your stored provider
      # credentials are encrypted against.
    # Matches the user the image builds, which owns /app/data inside it.
    user: "1001:1001"
    # Opens SlickSync on port 3000 of every network this machine is on, so
    # http://<server-address>:3000 works straight away. Docker opens this
    # past the host firewall (ufw does not block it). If a reverse proxy on
    # this same machine (Traefik, Caddy, nginx) is your way in, use
    # "127.0.0.1:3000:3000" instead so only the proxy can reach it.
    ports:
      - "3000:3000"
    volumes:
      # The database, the generated encryption key, Vault backups and avatars
      # all live here. Without this the container's own filesystem holds them,
      # and `docker compose pull && up -d` replaces the container and takes
      # every one of them with it.
      - slicksync_data:/app/data
    restart: unless-stopped

volumes:
  slicksync_data:
