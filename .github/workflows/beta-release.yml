name: Beta Release

on:
  push:
    tags:
      - 'beta-v*.*.*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Deliberately GHCR-only, unlike private/public - Docker Hub pull-count
      # is meant to track real installs of the stable images, and a "beta"
      # tag showing up there would just be test traffic, not a real metric.
      - name: Extract metadata (beta)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Not using type=semver here like the private/public workflows do -
          # their tags (vX.Y.Z) are already bare semver, but a beta-vX.Y.Z tag
          # isn't, and semver extraction from a prefixed ref isn't worth the
          # edge cases. The pushed tag name is already exactly what we want
          # for the pinned output tag, so just reuse it directly.
          tags: |
            type=raw,value=beta
            type=raw,value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=slicksync-beta

      - name: Build and push Docker image (beta)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTANCE=private
          cache-from: type=gha
          cache-to: type=gha,mode=max
